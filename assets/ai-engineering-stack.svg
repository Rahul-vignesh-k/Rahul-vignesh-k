  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif"><text x="78" y="142" fill="#3DD9EB" font-size="12" font-weight="700" letter-spacing="1.4">01 / PRODUCT</text><text x="78" y="177" fill="#EEF7FF" font-size="20" font-weight="700">Input &amp; context</text><text x="78" y="208" fill="#97A9BD" font-size="14">Documents · users</text><text x="78" y="231" fill="#97A9BD" font-size="14">meter + weather data</text><text x="304" y="142" fill="#55BFF3" font-size="12" font-weight="700" letter-spacing="1.4">02 / INTELLIGENCE</text><text x="304" y="177" fill="#EEF7FF" font-size="20" font-weight="700">Reason &amp; predict</text><text x="304" y="208" fill="#97A9BD" font-size="14">agents · retrieval</text><text x="304" y="231" fill="#97A9BD" font-size="14">forecasting · fusion</text><text x="530" y="142" fill="#6F93FF" font-size="12" font-weight="700" letter-spacing="1.4">03 / SERVICE</text><text x="530" y="177" fill="#EEF7FF" font-size="20" font-weight="700">Expose &amp; persist</text><text x="530" y="208" fill="#97A9BD" font-size="14">FastAPI · typed APIs</text><text x="530" y="231" fill="#97A9BD" font-size="14">SQL · vector storage</text><text x="756" y="142" fill="#927DFF" font-size="12" font-weight="700" letter-spacing="1.4">04 / TRUST</text><text x="756" y="177" fill="#EEF7FF" font-size="20" font-weight="700">Evaluate &amp; guard</text><text x="756" y="208" fill="#97A9BD" font-size="14">citations · validation</text><text x="756" y="231" fill="#97A9BD" font-size="14">auth · audit · tests</text><text x="982" y="142" fill="#B780FF" font-size="12" font-weight="700" letter-spacing="1.4">05 / DELIVERY</text><text x="982" y="177" fill="#EEF7FF" font-size="20" font-weight="700">Ship &amp; observe</text><text x="982" y="208" fill="#97A9BD" font-size="14">Docker · CI gates</text><text x="982" y="231" fill="#97A9BD" font-size="14">logs · secure config</text></g>
  <g fill="#0B1423" stroke="url(#line)" stroke-width="2"><circle cx="260" cy="184" r="10"/><circle cx="486" cy="184" r="10"/><circle cx="712" cy="184" r="10"/><circle cx="938" cy="184" r="10"/></g><g fill="#C7D8EE"><path d="M257 179L263 184L257 189V179Z"/><path d="M483 179L489 184L483 189V179Z"/><path d="M709 179L715 184L709 189V179Z"/><path d="M935 179L941 184L935 189V179Z"/></g>
