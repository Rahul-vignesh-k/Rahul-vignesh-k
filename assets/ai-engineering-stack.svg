<svg width="1200" height="350" viewBox="0 0 1200 350" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Rahul's AI engineering stack</title><desc id="desc">A five-stage architecture showing product input, intelligence, service, trust, and delivery layers.</desc>
  <defs><linearGradient id="panel" x1="40" y1="25" x2="1160" y2="325" gradientUnits="userSpaceOnUse"><stop stop-color="#0A1524"/><stop offset="1" stop-color="#111126"/></linearGradient><linearGradient id="line" x1="118" y1="0" x2="1082" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#3DD9EB"/><stop offset="0.52" stop-color="#5B8CFF"/><stop offset="1" stop-color="#A879FF"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000814" flood-opacity="0.3"/></filter></defs>
  <rect x="1" y="1" width="1198" height="348" rx="20" fill="url(#panel)" stroke="#26364E"/><text x="52" y="54" fill="#7F91A9" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="2">SYSTEM VIEW / FROM SIGNAL TO RELIABLE OUTCOME</text><path d="M164 184H1036" stroke="url(#line)" stroke-width="2" stroke-dasharray="5 9" opacity="0.6"/>
